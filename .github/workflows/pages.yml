# 部署 site/ 到 GitHub Pages（issue #69）
# 一次性前置：仓库 Settings → Pages → Source 选「GitHub Actions」
name: Deploy site to Pages

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# 同一分支只保留最新一次部署，排队中的旧部署直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 站点护栏（issue #69 阶段 2）：动效越界/layout 抖动、图片偷跑全尺寸、降级块被删——
      # 任何一项打红即不上线，把验收标准从「一次性核对」变成「持续成立」
      - name: Audit site (guardrails)
        run: node scripts/audit-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
