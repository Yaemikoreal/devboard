<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>devboard — 总览 / 项目 双视图 demo</title>
<style>
/* 设计 token 与 src/renderer/styles.css 保持一致（案例2 Crextio 浅色纪律） */
:root{
  --bg:#f5f2e8; --card:#fdfcf8; --well:#ece9dd;
  --ink:#181818; --ink-2:#4d463c; --ink-3:#857d6b;
  --line:rgba(24,24,24,.09); --accent:#f5d90a;
  --tile:#322e27; --tile-ink:#fdfcf8; --tile-ink2:#a89f8e;
  --close-red:#e81123;
  --shadow-1:0 1px 2px rgba(24,24,24,.04),0 14px 34px rgba(24,24,24,.05);
  --shadow-2:0 2px 6px rgba(24,24,24,.06),0 22px 48px rgba(24,24,24,.09);
  --r-card:24px; --r-chip:10px; --r-pill:999px;
  --band-hot:#f5d90a; --band-active:#d98e32; --band-cool:#7d94a8;
  --band-stale:#b3ac9a; --band-arch:#d8d3c2;
  --btn-line:rgba(24,24,24,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  font-weight:450;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace}
.app{max-width:1440px;height:100vh;margin:0 auto;display:flex;flex-direction:column}
.hidden{display:none !important}

/* 标题栏 */
.titlebar{height:40px;flex:none;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.tb-name{flex:1;padding-left:16px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-2)}
.win-controls{display:flex;height:100%}
.wc{width:46px;height:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.wc:hover{background:rgba(24,24,24,.06)}
.wc.close:hover{background:var(--close-red)}
.wc i{position:relative;display:block}
.wc.min i{width:10px;height:1px;background:var(--ink)}
.wc.max i{width:9px;height:9px;border:1px solid var(--ink)}
.wc.close i{width:12px;height:12px}
.wc.close i::before,.wc.close i::after{content:"";position:absolute;left:0;top:5.5px;width:12px;height:1px;background:var(--ink)}
.wc.close i::before{transform:rotate(45deg)}.wc.close i::after{transform:rotate(-45deg)}
.wc.close:hover i::before,.wc.close:hover i::after{background:var(--tile-ink)}

/* 顶栏 */
.topbar{flex:none;display:flex;align-items:center;gap:20px;padding:10px 24px 0}
.logo{border:1.5px solid var(--ink);border-radius:var(--r-pill);padding:7px 18px;font-size:13px;font-weight:700;letter-spacing:.05em}
.nav{margin:0 auto;display:flex;gap:2px;background:var(--well);border-radius:var(--r-pill);padding:4px}
.nav button{border:0;background:transparent;border-radius:var(--r-pill);padding:7px 18px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;transition:background-color .18s,color .18s}
.nav button:hover{color:var(--ink)}
.nav button.active{background:var(--tile);color:var(--tile-ink);font-weight:600}
.search{position:relative;display:flex;align-items:center;gap:6px;background:var(--well);border-radius:var(--r-pill);padding:0 12px;height:34px}
.search input{border:0;background:transparent;outline:none;width:120px;font:inherit;font-size:12.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search .kbd{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:16px}
.icon-btn{width:38px;height:38px;flex:none;border:0;border-radius:50%;cursor:pointer;background:var(--tile);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{opacity:.85}
.ic-set{width:14px;height:12px;position:relative}
.ic-set::before,.ic-set::after{content:"";position:absolute;left:0;width:14px;height:1.5px;background:var(--tile-ink)}
.ic-set::before{top:2px}.ic-set::after{bottom:2px}
.ic-set b{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--tile-ink)}
.ic-set b:nth-child(1){left:3px;top:.5px}.ic-set b:nth-child(2){right:2px;bottom:.5px}
.ic-ref{width:12px;height:12px;border:1.5px solid var(--tile-ink);border-top-color:transparent;border-radius:50%;position:relative}
.ic-ref::after{content:"";position:absolute;top:-3px;right:-2px;border:3px solid transparent;border-left-color:var(--tile-ink);transform:rotate(-30deg)}

/* 搜索补全 */
.drop{position:absolute;top:calc(100% + 8px);right:0;z-index:70;min-width:280px;max-height:300px;overflow-y:auto;background:var(--card);border-radius:var(--r-chip);box-shadow:var(--shadow-2);border:1px solid var(--line);padding:5px;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s}
.drop.open{opacity:1;transform:none;pointer-events:auto}
.drop-item{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:transparent;cursor:pointer;text-align:left;border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px;color:var(--ink)}
.drop-item:hover{background:var(--well)}
.drop-item .nm{font-weight:600}
.drop-item .rt{margin-left:auto;font-size:10.5px;color:var(--ink-3)}
.drop-empty{padding:8px 10px;font-size:12px;color:var(--ink-3)}

/* 视图容器 */
main{flex:1;min-height:0;overflow-y:auto;padding:14px 24px 24px}

/* ===== 总览页 ===== */
.stats{display:flex;align-items:baseline;gap:48px;padding:4px 0 14px}
.stat{display:flex;align-items:baseline;gap:8px}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat-num .unit{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
.stat-label{font-size:12.5px;color:var(--ink-2)}
.ov-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.ov-card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:20px 22px}
.ov-card h3{font-size:13px;font-weight:700;letter-spacing:.02em;margin-bottom:4px}
.ov-card .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:12px}

/* 全局热力图 */
.heat-card{margin-bottom:16px}
.heat-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.heat-head .t{font-size:15px;font-weight:700}
.heat-head .t b{font-size:22px;letter-spacing:-.02em;margin-right:6px}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3)}
.heat-legend .cell{width:9px;height:9px}
.gheat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;width:100%}
.cell{border-radius:20%;background:#ece8dc;aspect-ratio:1}
.cell.blank{visibility:hidden}
.cell.l1{background:#f3e58e}.cell.l2{background:#f5d90a}.cell.l3{background:#d8b406}
.heat-axis{position:relative;height:14px;margin-top:6px}
.heat-axis .mon{position:absolute;top:0;font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.heat-axis .today{position:absolute;right:0;top:0;font-size:9.5px;color:var(--ink-3)}

/* 活动流 */
.stream-month{margin-bottom:18px}
.stream-month > h4{font-size:12px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.stream-block{border-top:1px solid var(--line);padding:12px 0}
.stream-block .head{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.stream-block .head .n{font-weight:450;color:var(--ink-2)}
.stream-proj{display:flex;align-items:center;gap:10px;padding:4px 8px;margin:0 -8px;font-size:12.5px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.stream-proj:hover{background:var(--well)}
.stream-proj:hover .nm{text-decoration:underline}
.stream-proj::after{content:"›";color:var(--ink-3);opacity:0;transition:opacity .15s;font-size:13px}
.stream-proj:hover::after{opacity:1}
.stream-proj .nm{color:var(--ink);font-weight:600;min-width:150px}
.stream-proj .ct{color:var(--ink-3);font-size:11.5px}
.stream-proj .bar{margin-left:auto;height:8px;border-radius:4px;background:var(--accent);min-width:8px;transition:transform .15s,box-shadow .15s}
.stream-proj:hover .bar{transform:scaleY(1.4);box-shadow:0 1px 4px rgba(245,217,10,.45)}
.show-more{width:100%;border:1px solid var(--line);background:transparent;border-radius:var(--r-chip);padding:8px 0;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.show-more:hover{border-color:var(--ink-3);color:var(--ink)}

/* 需要关注：黑卡（视觉权重最高） */
.attn-card{background:var(--tile);color:var(--tile-ink);border-radius:var(--r-card);box-shadow:var(--shadow-2);padding:16px 18px;margin-bottom:16px}
.attn-card h3{font-size:13px;font-weight:600}
.attn-card .sub{font-size:11px;color:var(--tile-ink2);margin:4px 0 8px}
.attn-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(253,252,248,.12);cursor:pointer}
.attn-item .ic{width:18px;height:18px;flex:none;border-radius:50%;border:1px solid rgba(253,252,248,.35);display:flex;align-items:center;justify-content:center}
.attn-item .ic::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--tile-ink)}
.attn-item .nm{font-weight:600;font-size:12.5px;white-space:nowrap}
.attn-item .ds{flex:1;font-size:11px;color:var(--tile-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attn-item .mk{width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent)}

/* 工作台：Agent 工具 */
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--btn-line);background:transparent;border-radius:var(--r-chip);padding:9px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,background-color .15s}
.tool-btn:hover{border-color:var(--ink-3);color:var(--ink);background:rgba(24,24,24,.035)}
.tool-logo{width:22px;height:22px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tool-logo svg{width:100%;height:100%;display:block}
.tool-btn .cmd{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,Consolas,monospace}

/* ===== 项目页 ===== */
.filterbar{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.chips{display:flex;gap:2px;background:var(--well);border-radius:var(--r-pill);padding:4px}
.chips button{border:0;background:transparent;border-radius:var(--r-pill);padding:5px 13px;font:inherit;font-size:12px;color:var(--ink-2);cursor:pointer}
.chips button:hover{color:var(--ink)}
.chips button.active{background:var(--tile);color:var(--tile-ink);font-weight:600}
.sort-wrap{margin-left:auto;position:relative}
.sort-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:transparent;border-radius:var(--r-pill);padding:6px 14px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.sort-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.sort-btn .caret{font-size:9px}
.sort-drop{left:auto;right:0;min-width:160px}
.sort-drop .drop-item .cur{margin-left:auto;font-size:10px;font-weight:700;background:var(--accent);border-radius:var(--r-pill);padding:1px 7px}

.split{display:flex;gap:0;align-items:flex-start;transition:gap .3s ease}
.rows{flex:1;min-width:0;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);overflow:hidden}
.split.open{gap:16px}

/* 行（m2 风格 + 本设计纪律） */
.row{position:relative;display:flex;align-items:center;gap:14px;padding:15px 20px 15px 24px;border-top:1px solid var(--line);cursor:pointer;transition:background-color .15s}
.row:first-child{border-top:0}
.row:hover{background:rgba(24,24,24,.025)}
.row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--band-c,transparent);transition:width .15s}
.row[data-band=hot]{--band-c:var(--band-hot)}
.row[data-band=active]{--band-c:var(--band-active)}
.row[data-band=cooling]{--band-c:var(--band-cool)}
.row[data-band=stale]{--band-c:var(--band-stale)}
.row[data-band=archive]{--band-c:var(--band-arch)}
.row.selected{background:#faf8f0}
.row.selected::before{width:5px}
.row.dragging{opacity:.45}
.row .r-main{flex:1;min-width:0}
.row .r-top{display:flex;align-items:baseline;gap:10px}
.row .r-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.row .r-branch{font-size:11px;color:var(--ink-3)}
.row .r-sub{margin-top:2px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-sub.empty{color:var(--ink-3)}
.row .r-right{display:flex;align-items:center;gap:14px;flex:none}
.r-warn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
.r-warn i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(245,217,10,.25)}
.r-upd{font-size:11.5px;color:var(--ink-3);white-space:nowrap;min-width:76px;text-align:right}
.r-pin{border:0;background:transparent;cursor:pointer;font-size:16px;color:var(--ink-3);line-height:1;padding:2px}
.r-pin.on{color:var(--accent);text-shadow:0 0 1px var(--ink)}
.r-pin:hover{color:var(--ink)}
.r-pin.on:hover{color:var(--accent)}
.r-open{width:26px;height:26px;border:1px solid var(--btn-line);background:transparent;border-radius:50%;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .15s,color .15s}
.r-open:hover{border-color:var(--ink-3);color:var(--ink)}
.row.selected .r-open{transform:rotate(90deg);background:var(--tile);color:var(--tile-ink);border-color:var(--tile)}

/* 详情面板：右侧推出 */
.panel{width:0;flex:none;overflow:hidden;transition:width .3s ease}
.split.open .panel{width:400px}
.panel-in{width:400px;max-height:calc(100vh - 150px);overflow-y:auto;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:20px 22px;opacity:0;transform:translateX(12px);transition:opacity .25s .05s,transform .25s .05s}
.split.open .panel-in{opacity:1;transform:none}
.p-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.p-head .nm{font-size:20px;font-weight:700;letter-spacing:-.01em;flex:1}
.bp{border-radius:var(--r-pill);padding:3px 11px;font-size:11px;font-weight:600;letter-spacing:.04em}
.bp-hot{background:var(--accent);color:var(--ink)}
.bp-active{background:var(--tile);color:var(--tile-ink)}
.bp-cool{border:1px solid var(--line);color:var(--ink-2);background:var(--bg)}
.bp-stall{background:#e8e5d9;color:var(--ink-2)}
.bp-arch{border:1px dashed var(--ink-3);color:var(--ink-3);background:transparent}
.p-close{width:28px;height:28px;border:0;border-radius:50%;background:var(--well);cursor:pointer;color:var(--ink-2);font-size:12px}
.p-close:hover{background:var(--ink);color:var(--tile-ink)}
.p-path{font-size:11px;color:var(--ink-3);margin-bottom:12px}
.memo-input{width:100%;border:1px solid var(--line);border-radius:var(--r-chip);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;outline:none;resize:none;min-height:34px;line-height:1.45}
.memo-input:focus{border-color:var(--ink-3)}
.p-sec{margin-top:16px}
.p-sec > h4{font-size:11px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:7px;font-weight:700}
.kv-row{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink-2)}
.kv-row b{color:var(--ink);font-weight:600;font-family:ui-monospace,Consolas,monospace}
.warn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--ink);border-radius:var(--r-pill);padding:4px 12px;font-size:11.5px;font-weight:600;margin:0 6px 6px 0}
.warn .x{width:14px;height:14px;border:0;border-radius:50%;background:rgba(24,24,24,.15);color:var(--ink);cursor:pointer;font-size:10px;line-height:1;padding:0}
.warn .x:hover{background:var(--ink);color:var(--accent)}
.p-heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.line-item{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.line-item:first-of-type{border-top:0}
.line-item .msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-item .ago{font-size:11px;color:var(--ink-3);white-space:nowrap}
.readme-s{font-size:12.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-chip);padding:10px 12px}
.ai-item{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:12.5px}
.ai-item .tool{font-weight:600}
.ai-item .ago{margin-left:auto;font-size:11px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--btn-line);background:transparent;color:var(--ink-2);border-radius:var(--r-pill);padding:6px 15px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s}
.btn:hover{border-color:var(--ink-3);color:var(--ink);background:rgba(24,24,24,.035)}
.btn.solid{background:var(--tile);border-color:var(--tile);color:var(--tile-ink)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.tools-row{display:flex;gap:8px;flex-wrap:wrap}
.tools-row .tool-btn{padding:6px 12px;font-size:12px}
.dirty-toggle{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;font-size:12.5px;color:var(--ink-2)}
.dirty-toggle .caret{font-size:9px;transition:transform .2s}
.dirty-toggle.open .caret{transform:rotate(90deg)}
.dirty-list{display:none;margin-top:6px}
.dirty-list.open{display:block}
.dirty-list .f{display:block;padding:4px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 热力图悬停气泡 */
.heat-tip{
  position:fixed;z-index:100;background:var(--tile);color:var(--tile-ink);
  border-radius:8px;padding:5px 11px;font-size:11.5px;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .12s ease;
  transform:translate(-50%,-100%);
}
.heat-tip::after{
  content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--tile);border-bottom:0;
}

/* 滚动条：纤细圆角（与实现同步的自定义样式） */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--band-arch);border:3px solid transparent;border-radius:var(--r-pill);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>
<div class="app">

  <div class="titlebar">
    <span class="tb-name">devboard</span>
    <div class="win-controls">
      <button class="wc min" tabindex="-1"><i></i></button>
      <button class="wc max" tabindex="-1"><i></i></button>
      <button class="wc close" tabindex="-1"><i></i></button>
    </div>
  </div>

  <div class="topbar">
    <span class="logo">devboard</span>
    <nav class="nav">
      <button class="active" data-view="overview">总览</button>
      <button data-view="projects">项目</button>
    </nav>
    <div class="search">
      <input id="searchInput" placeholder="搜索项目 / 备忘…">
      <span class="kbd">/</span>
      <div class="drop" id="suggest"></div>
    </div>
    <button class="icon-btn" title="刷新"><span class="ic-ref"></span></button>
    <button class="icon-btn" title="设置"><span class="ic-set"><b></b><b></b></span></button>
  </div>

  <!-- ============ 总览 ============ -->
  <main id="viewOverview">
    <div class="stats">
      <div class="stat"><span class="stat-num">8<span class="unit">个</span></span><span class="stat-label">项目</span></div>

function renderHeat(container, axis, data){
  container.innerHTML='';
  const offset = (new Date(Date.now()-364*864e5).getDay()+6)%7; // 周一开头
  for(let i=0;i<offset;i++){ const c=document.createElement('div'); c.className='cell blank'; container.appendChild(c); }
  data.forEach((v,i)=>{
    const c=document.createElement('div');
    c.className='cell'+(v===0?'':v<3?' l1':v<7?' l2':' l3');
    const d=new Date(Date.now()-(364-i)*864e5);
    c.dataset.tip=`${d.getMonth()+1}月${d.getDate()}日 · ${v?v+' 次提交':'无提交'}`;
    container.appendChild(c);
  });
  if(axis){
    axis.innerHTML='';
    const cols=Math.ceil((365+offset)/7), today=new Date();
    for(let w=0;w<cols;w++){
      const d=new Date(Date.now()-(364-w*7+6-offset)*864e5);
      if(axis.lastMonth!==d.getMonth() && w<cols-1){
        const s=document.createElement('span'); s.className='mon';
        s.style.left=(w/cols*100)+'%'; s.textContent=MONS[d.getMonth()];
        axis.appendChild(s); axis.lastMonth=d.getMonth();
      }
    }
    const t=document.createElement('span'); t.className='today'; t.textContent='今天'; axis.appendChild(t);
  }
}

function sortedProjects(){
  let list=[...PROJECTS];
  if(curBand!=='all') list=list.filter(p=>p.band===curBand);
  if(curSort==='最近活跃') list.sort((a,b)=>a.daysAgo-b.daysAgo);
  else if(curSort==='名称') list.sort((a,b)=>a.name.localeCompare(b.name));
  else list.sort((a,b)=>manualOrder.indexOf(a.name)-manualOrder.indexOf(b.name));
  // 图钉置顶（各排序方式下均生效）
  list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  return list;
}

function relTime(p){
  if(p.daysAgo<1) return '今天';
  if(p.daysAgo<30) return Math.round(p.daysAgo)+' 天前';
  return Math.round(p.daysAgo/30)+' 个月前';
}

  const c=e.target.closest('.cell');
  if(!c||c.classList.contains('blank')||!c.dataset.tip
     ||!c.closest('.gheat,.p-heat')){ heatTip.style.opacity=0; return; }
  heatTip.textContent=c.dataset.tip;
  const r=c.getBoundingClientRect();
  heatTip.style.left=(r.left+r.width/2)+'px';
  heatTip.style.top=(r.top-8)+'px';
  heatTip.style.opacity=1;
});
document.addEventListener('mouseleave',()=>heatTip.style.opacity=0,true);

/* ---------------- 跳转：关注清单 / 活动流 / 搜索 → 项目页详情 ---------------- */
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');
  if(!j) return;
  gotoProjects(); suggest.classList.remove('open');
  selectProject(j.dataset.jump);
});

renderRows();
</script>
</body>
</html>
